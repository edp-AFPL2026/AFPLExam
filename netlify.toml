# Netlify settings for the Aakar Internship Aptitude Test

[build]
  publish = "public"                 # your frontend files go in /public
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Every /api/... request is handled by the Express app inside netlify/functions/api.js
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Auto-submit: closes every exam whose timer has ended (even if the student closed the browser). Runs every minute.
[functions."autosubmit"]
  schedule = "* * * * *"

[functions]
  node_bundler = "zisi"
  # makes sure the Firebase key file is shipped with the API function
  included_files = ["serviceAccountKey.json"]

# Basic security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Static files: let the browser reuse them for 10 minutes instead of asking the server on every page load
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Keep the admin pages out of search engines
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
